name: Shopify App CI

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/shopify-app/**'
      - '.github/workflows/shopify-app.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'apps/shopify-app/**'
      - '.github/workflows/shopify-app.yml'

defaults:
  run:
    working-directory: apps/shopify-app

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: apps/shopify-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test

      - name: Validate OpenAPI spec
        run: node -e "const s = require('./app/swagger'); if (!s.paths || Object.keys(s.paths).length < 5) process.exit(1); console.log('OpenAPI paths:', Object.keys(s.paths).length)"
        working-directory: apps/shopify-app