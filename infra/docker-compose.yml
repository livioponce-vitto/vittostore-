# VittoStore — dev stack
# Lanzar: docker compose -f infra/docker-compose.yml up

services:
  shopify-app:
    build:
      context: ../apps/shopify-app
      dockerfile: ../../infra/Dockerfile
    container_name: vittostore-shopify
    restart: unless-stopped
    env_file:
      - ../apps/shopify-app/.env
    ports:
      - "3000:3000"
    volumes:
      - ../apps/shopify-app/config:/app/config
      - ../apps/shopify-app/public:/app/public
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  oraculo:
    build:
      context: ../apps/oraculo-backend
    container_name: vittostore-oraculo
    restart: unless-stopped
    env_file:
      - ../apps/oraculo-backend/.env
    ports:
      - "3001:3000"
    volumes:
      - oraculo-data:/app/data
    depends_on:
      shopify-app:
        condition: service_healthy

volumes:
  oraculo-data: