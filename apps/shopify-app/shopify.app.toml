# Configuracion principal de la app VittoStore para Shopify
name = "vittostore"
client_id = "5fb33307183daf22d5c8ce538244df4f"
application_url = "https://crystal-daytime-trial.ngrok-free.dev"
embedded = true
handle = "vittostore"

[build]
automatically_update_urls_on_dev = true
dev_store_url = "vittostore.myshopify.com"

# ─────────────────────────────────────────────
# PERMISOS - Tienda chilena (productos + pedidos + clientes + pagos)
# ─────────────────────────────────────────────
[access_scopes]
scopes = "write_products,read_products,read_orders,write_orders,read_customers,write_customers,read_inventory,write_inventory,read_shipping,read_analytics,write_metaobject_definitions,write_metaobjects"

# ─────────────────────────────────────────────
# WEBHOOKS
# ─────────────────────────────────────────────
[webhooks]
api_version = "2024-07"

  # App desinstalada
  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/webhooks/app/uninstalled"

  # Actualizacion de scopes
  [[webhooks.subscriptions]]
  topics = ["app/scopes_update"]
  uri = "/webhooks/app/scopes_update"

  # Nuevo pedido creado
  [[webhooks.subscriptions]]
  topics = ["orders/create"]
  uri = "/webhooks/orders/create"

  # Pedido pagado
  [[webhooks.subscriptions]]
  topics = ["orders/paid"]
  uri = "/webhooks/orders/paid"

  # Pedido cancelado
  [[webhooks.subscriptions]]
  topics = ["orders/cancelled"]
  uri = "/webhooks/orders/cancelled"

  # Producto creado
  [[webhooks.subscriptions]]
  topics = ["products/create"]
  uri = "/webhooks/products/create"

  # Producto actualizado
  [[webhooks.subscriptions]]
  topics = ["products/update"]
  uri = "/webhooks/products/update"

  # Carrito abandonado (recuperacion de carritos)
  [[webhooks.subscriptions]]
  topics = ["checkouts/update"]
  uri = "/cart-recovery/webhook"

  # ─────────────────────────────────────────────
  # COMPLIANCE GDPR - OBLIGATORIOS para app publica
  # Ver: https://shopify.dev/docs/apps/build/privacy-law-compliance
  # ─────────────────────────────────────────────

  # Solicitud de datos de cliente (Ley 19.628 Chile + GDPR)
  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = ["customers/data_request"]

  # Borrado de datos de cliente
  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = ["customers/redact"]


  # Borrado de datos de tienda
    [[webhooks.subscriptions]]
    uri = "/webhooks/shop/redact"
    compliance_topics = ["shop/redact"]

  # ─────────────────────────────────────────────
  # AUTH (requerido por Shopify CLI)
  # ─────────────────────────────────────────────
  [auth]
  redirect_urls = ["https://crystal-daytime-trial.ngrok-free.dev/auth/callback"]
