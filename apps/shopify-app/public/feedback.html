<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Feedback VITTOSTORE</title>
</head>
<body>
  <h2>Envíanos tu feedback</h2>
  <form action="https://docs.google.com/forms/d/e/1FAIpQLSfEjemplo/formResponse" method="POST" target="_blank">
    <label for="email">Correo electrónico:</label><br>
    <input type="email" id="email" name="entry.123456" required><br><br>
    <label for="tipo">Tipo de comentario:</label><br>
    <select id="tipo" name="entry.654321">
      <option value="Bug">Bug</option>
      <option value="Mejora">Mejora</option>
      <option value="Duda">Duda</option>
      <option value="Otro">Otro</option>
    </select><br><br>
    <label for="mensaje">Mensaje:</label><br>
    <textarea id="mensaje" name="entry.111111" rows="4" cols="40" required></textarea><br><br>
    <button type="submit">Enviar</button>
  </form>
  <p>Tu opinión es muy importante para mejorar VITTOSTORE.</p>
</body>
</html>
